  <!-- Repo Title -->
  <text x="22" y="72" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#0F172A">node_modules_killer</text>

  <!-- Description -->
  <text x="22" y="99" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">Direct NTFS MFT scanner (usn-journal-rs) +</text>
  <text x="22" y="119" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">ratatui TUI to purge node_modules instantly.</text>

  <!-- Footer meta -->
  <circle cx="28" cy="145" r="4" fill="#059669"/>
  <text x="39" y="149" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#94A3B8">Code</text>
  <text x="458" y="149" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#059669">OPEN REPO →</text>

  <!-- Schematic Icon -->
  
        <g transform="translate(496, 46)" opacity="0.9">
          <circle cx="34" cy="34" r="26" fill="none" stroke="#CBD5E1" stroke-width="1.5"/>
          <circle cx="34" cy="34" r="16" fill="none" stroke="#059669" stroke-width="1.6" stroke-dasharray="16 8"/>
          <circle cx="34" cy="34" r="5" fill="#059669"/>
          <line x1="34" y1="34" x2="54" y2="16" stroke="#059669" stroke-width="1.8"/>
        </g>
