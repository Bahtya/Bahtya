<svg xmlns="http://www.w3.org/2000/svg" width="584" height="168" viewBox="0 0 584 168" role="img" aria-label="node_modules_killer">
  <defs>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDF2F7" stroke-width="0.9"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="583" height="167" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
