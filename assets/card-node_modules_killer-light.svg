  <rect x="0.5" y="18" width="3.5" height="132" rx="1.75" fill="#059669"/>

  <!-- Category Pill -->
  <rect x="22" y="18" width="144" height="22" rx="4" fill="rgba(5,150,105,0.10)"/>
  <text x="33" y="33" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#059669">NTFS MFT · TUI</text>

  <!-- Star / Status Pill -->
  <rect x="464" y="18" width="98" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
