<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Bahtya — Systems Engineer, Reverse Engineering, AI Agent Architect">
  <defs>
    <pattern id="heroGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#EDF2F7" stroke-width="1"/>
    </pattern>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="55%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="waveFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EA580C" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0.01"/>
    </linearGradient>
    <linearGradient id="scanSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0891B2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#0891B2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0891B2" stop-opacity="0"/>
    </linearGradient>
    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="crtClip">
      <rect x="696" y="86" width="460" height="146" rx="8"/>
    </clipPath>
    <style>
      .pulse-led { animation: ledPulse 2.4s ease-in-out infinite; }
      .blink-cur { animation: curBlink 1.1s steps(2, start) infinite; }
      .scan-bar { animation: sweepX 6.5s linear infinite; }
      .wave-flow { stroke-dasharray: 6 6; animation: dashMove 18s linear infinite; }
      @keyframes ledPulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
      @keyframes curBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
      @keyframes sweepX { 0% { transform: translateX(-90px); } 100% { transform: translateX(550px); } }
      @keyframes dashMove { to { stroke-dashoffset: -240; } }
    </style>
  </defs>

