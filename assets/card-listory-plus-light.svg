<svg xmlns="http://www.w3.org/2000/svg" width="584" height="168" viewBox="0 0 584 168" role="img" aria-label="listory-plus">
  <defs>
    <pattern id="cardGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#EDF2F7" stroke-width="0.9"/>
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="583" height="167" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="1" y="1" width="582" height="166" rx="11" fill="url(#cardGrid)" opacity="0.65"/>
  <rect x="0.5" y="18" width="3.5" height="132" rx="1.75" fill="#EA580C"/>

  <!-- Category Pill -->
  <rect x="22" y="18" width="185" height="22" rx="4" fill="rgba(234,88,12,0.10)"/>
  <text x="33" y="33" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="700" letter-spacing="0.8" fill="#EA580C">SEARCH ENGINE · TAURI</text>

  <!-- Star / Status Pill -->
  <rect x="464" y="18" width="98" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="513" y="33" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10.5" font-weight="600" fill="#475569">OPEN SOURCE</text>

  <!-- Repo Title -->
  <text x="22" y="72" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="22" font-weight="700" fill="#0F172A">listory-plus</text>

  <!-- Description -->
  <text x="22" y="99" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">Lightning-fast file &amp; content search engine</text>
  <text x="22" y="119" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#475569">for Windows powered by native Rust + Tauri.</text>

  <!-- Footer meta -->
  <circle cx="28" cy="145" r="4" fill="#dea584"/>
  <text x="39" y="149" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="600" fill="#94A3B8">Rust</text>
  <text x="458" y="149" text-anchor="end" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" fill="#EA580C">OPEN REPO →</text>

  <!-- Schematic Icon -->
  
    <g transform="translate(496, 46)" opacity="0.9">
      <circle cx="30" cy="30" r="20" fill="none" stroke="#EA580C" stroke-width="1.8"/>
      <circle cx="30" cy="30" r="9" fill="#EA580C" opacity="0.18" stroke="#CBD5E1" stroke-width="1.2"/>
      <line x1="45" y1="45" x2="60" y2="60" stroke="#EA580C" stroke-width="3" stroke-linecap="round"/>
    </g>
</svg>